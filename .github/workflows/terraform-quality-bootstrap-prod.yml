name: Terraform quality bootstrap prod

on:
  pull_request:
    branches:
      - main
    paths:
      - "bootstrap/**"
      - "modules/ecr/**"
      - "modules/github_iac_roles/**"
      - "scripts/quality/**"
      - "scripts/security/**"
      - ".github/scripts/terraform-bootstrap.ps1"
      - ".github/workflows/terraform-bootstrap-prod.yml"
      - ".github/workflows/terraform-quality-bootstrap-prod.yml"
  push:
    branches:
      - main
    paths:
      - "bootstrap/**"
      - "modules/ecr/**"
      - "modules/github_iac_roles/**"
      - "scripts/quality/**"
      - "scripts/security/**"
      - ".github/scripts/terraform-bootstrap.ps1"
      - ".github/workflows/terraform-bootstrap-prod.yml"
      - ".github/workflows/terraform-quality-bootstrap-prod.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraform-quality-bootstrap-prod-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate prod bootstrap code
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TF_IN_AUTOMATION: true
      TF_INPUT: false

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Set up TFLint
        uses: terraform-linters/setup-tflint@6e1e0642c0289bd619021bf6b34e3c08ed1e005a # v6.3.0
        with:
          tflint_version: v0.64.0

      - name: Run the bootstrap quality gate
        shell: pwsh
        run: >-
          ./scripts/quality/terraform-gate.ps1 -Mode ci
          -Roots bootstrap,modules/ecr,modules/github_iac_roles
