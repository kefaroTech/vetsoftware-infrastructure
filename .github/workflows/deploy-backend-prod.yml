name: Deploy backend image prod

# Circuito de imagen productiva. Solo acepta una release SemVer cuyo digest
# lleve tanto el tag X.Y.Z como sha-<12>, con escaneo ECR sin High ni Critical.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Strict SemVer release (X.Y.Z)"
        required: true
        type: string
      image_digest:
        description: "Immutable ECR digest (sha256:...)"
        required: true
        type: string
      source_commit:
        description: "Full backend release commit SHA"
        required: true
        type: string
      source_run_url:
        description: "Auditable backend publication run URL"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-prod
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: true
  TF_INPUT: false

jobs:
  plan:
    name: Certify and plan prod
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: iac-plan-prod
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      AWS_ROLE_TO_ASSUME: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/vetsoftware-iac-plan-prod
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_STATE_KMS_KEY_ARN: ${{ vars.TF_STATE_KMS_KEY_ARN }}
      TF_VAR_api_domain_name: ${{ vars.API_DOMAIN_NAME }}
      TF_VAR_cors_allowed_origins: ${{ vars.CORS_ALLOWED_ORIGINS }}
      TF_VAR_email_from: ${{ vars.EMAIL_FROM }}
      TF_VAR_grafana_otlp_endpoint: ${{ vars.GRAFANA_OTLP_ENDPOINT }}
      TF_VAR_login_url: ${{ vars.LOGIN_URL }}
      TF_VAR_password_reset_url: ${{ vars.PASSWORD_RESET_URL }}
      TF_VAR_registration_verification_url: ${{ vars.REGISTRATION_VERIFICATION_URL }}

    steps:
      - name: Check out immutable IaC revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Validate AWS plan configuration
        shell: pwsh
        run: |
          if ($env:AWS_ACCOUNT_ID -notmatch '^\d{12}$') {
            throw "Configure AWS_ACCOUNT_ID con los 12 digitos de la cuenta AWS en iac-plan-prod."
          }

      - name: Configure read-only AWS credentials
        uses: aws-actions/configure-aws-credentials@451ce2a72e8d729a59ebeaacab82dbce58e7af4c # v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Certify release and guard Terraform plan
        env:
          IMAGE_DIGEST: ${{ inputs.image_digest }}
          RELEASE_VERSION: ${{ inputs.version }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          SOURCE_RUN_URL: ${{ inputs.source_run_url }}
        shell: pwsh
        run: |
          ./scripts/deployment/backend-image.ps1 `
            -Mode Plan `
            -Environment prod `
            -Version $env:RELEASE_VERSION `
            -ImageDigest $env:IMAGE_DIGEST `
            -SourceCommit $env:SOURCE_COMMIT `
            -SourceRunUrl $env:SOURCE_RUN_URL

  apply:
    name: Approve, deploy and verify prod
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: iac-apply-prod
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      AWS_ROLE_TO_ASSUME: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/vetsoftware-iac-apply-prod
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_STATE_KMS_KEY_ARN: ${{ vars.TF_STATE_KMS_KEY_ARN }}
      TF_VAR_api_domain_name: ${{ vars.API_DOMAIN_NAME }}
      TF_VAR_cors_allowed_origins: ${{ vars.CORS_ALLOWED_ORIGINS }}
      TF_VAR_email_from: ${{ vars.EMAIL_FROM }}
      TF_VAR_grafana_otlp_endpoint: ${{ vars.GRAFANA_OTLP_ENDPOINT }}
      TF_VAR_login_url: ${{ vars.LOGIN_URL }}
      TF_VAR_password_reset_url: ${{ vars.PASSWORD_RESET_URL }}
      TF_VAR_registration_verification_url: ${{ vars.REGISTRATION_VERIFICATION_URL }}

    steps:
      - name: Check out immutable IaC revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Validate AWS apply configuration
        shell: pwsh
        run: |
          if ($env:AWS_ACCOUNT_ID -notmatch '^\d{12}$') {
            throw "Configure AWS_ACCOUNT_ID con los 12 digitos de la cuenta AWS en iac-apply-prod."
          }

      - name: Configure apply AWS credentials
        uses: aws-actions/configure-aws-credentials@451ce2a72e8d729a59ebeaacab82dbce58e7af4c # v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy immutable image, verify and roll back on failure
        env:
          IMAGE_DIGEST: ${{ inputs.image_digest }}
          RELEASE_VERSION: ${{ inputs.version }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          SOURCE_RUN_URL: ${{ inputs.source_run_url }}
        shell: pwsh
        run: |
          ./scripts/deployment/backend-image.ps1 `
            -Mode Apply `
            -Environment prod `
            -Version $env:RELEASE_VERSION `
            -ImageDigest $env:IMAGE_DIGEST `
            -SourceCommit $env:SOURCE_COMMIT `
            -SourceRunUrl $env:SOURCE_RUN_URL
