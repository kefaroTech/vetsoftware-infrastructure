name: Deploy backend image prod

# Circuito de imagen productiva. Un solo campo: la release SemVer. El digest se
# resuelve desde ECR y debe llevar tambien el tag sha-<12>, con escaneo sin High
# ni Critical. La forma X.Y.Z es lo que impide colar aca un build de develop.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release SemVer estricta ya publicada (X.Y.Z)"
        required: true
        type: string
      allow_rollback:
        description: "Permitir desplegar una versión anterior a la que está corriendo"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-prod
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: true
  TF_INPUT: false

jobs:
  plan:
    name: Certify and plan prod
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: iac-plan-prod
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      AWS_ROLE_TO_ASSUME: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/vetsoftware-iac-plan-prod
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_STATE_KMS_KEY_ARN: ${{ vars.TF_STATE_KMS_KEY_ARN }}
      TF_VARS_JSON: ${{ vars.TF_VARS_JSON }}
      TF_VAR_api_domain_name: ${{ vars.API_DOMAIN_NAME }}
      TF_VAR_cors_allowed_origins: ${{ vars.CORS_ALLOWED_ORIGINS }}
      TF_VAR_email_from: ${{ vars.EMAIL_FROM }}
      TF_VAR_grafana_otlp_endpoint: ${{ vars.GRAFANA_OTLP_ENDPOINT }}
      TF_VAR_login_url: ${{ vars.LOGIN_URL }}
      TF_VAR_password_reset_url: ${{ vars.PASSWORD_RESET_URL }}
      TF_VAR_registration_verification_url: ${{ vars.REGISTRATION_VERIFICATION_URL }}
      # Los cuatro UUID de plantilla de Resend del producto -verificacion de registro,
      # restablecimiento, invitacion de empleado y confirmacion de cita-. Dejan de ser un
      # default commiteado en el application.yml del backend: el identificador ya no viaja
      # dentro de la imagen y cada entorno apunta a las suyas. SIN prefijo: las lee del
      # environment del job. Van en los DOS bloques env, plan y apply: tenerlas en uno
      # solo hace divergir el plan del apply.
      TF_VAR_registration_verification_template_id: ${{ vars.REGISTRATION_VERIFICATION_TEMPLATE_ID }}
      TF_VAR_password_reset_template_id: ${{ vars.PASSWORD_RESET_TEMPLATE_ID }}
      TF_VAR_employee_invitation_template_id: ${{ vars.EMPLOYEE_INVITATION_TEMPLATE_ID }}
      TF_VAR_appointment_confirmation_template_id: ${{ vars.APPOINTMENT_CONFIRMATION_TEMPLATE_ID }}

    steps:
      - name: Check out immutable IaC revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      # Sin valor canonico para prod el check solo avisa; ver el manifiesto.
      - name: Verify OTLP endpoint parity
        shell: pwsh
        run: ./.github/scripts/assert-telemetry-endpoint.ps1 -Environment prod -Source 'vars.GRAFANA_OTLP_ENDPOINT (environment iac-plan-prod)'

      - name: Validate AWS plan configuration
        shell: pwsh
        run: |
          if ($env:AWS_ACCOUNT_ID -notmatch '^\d{12}$') {
            throw "Configure AWS_ACCOUNT_ID con los 12 digitos de la cuenta AWS en iac-plan-prod."
          }

      - name: Configure read-only AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Certify release and guard Terraform plan
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          ALLOW_ROLLBACK: ${{ inputs.allow_rollback }}
        shell: pwsh
        run: |
          ./scripts/deployment/backend-image.ps1 `
            -Mode Plan `
            -Environment prod `
            -Version $env:RELEASE_VERSION `
            -AllowRollback:($env:ALLOW_ROLLBACK -eq 'true')

  apply:
    name: Approve, deploy and verify prod
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: iac-apply-prod
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      AWS_ROLE_TO_ASSUME: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/vetsoftware-iac-apply-prod
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_STATE_KMS_KEY_ARN: ${{ vars.TF_STATE_KMS_KEY_ARN }}
      TF_VARS_JSON: ${{ vars.TF_VARS_JSON }}
      TF_VAR_api_domain_name: ${{ vars.API_DOMAIN_NAME }}
      TF_VAR_cors_allowed_origins: ${{ vars.CORS_ALLOWED_ORIGINS }}
      TF_VAR_email_from: ${{ vars.EMAIL_FROM }}
      TF_VAR_grafana_otlp_endpoint: ${{ vars.GRAFANA_OTLP_ENDPOINT }}
      TF_VAR_login_url: ${{ vars.LOGIN_URL }}
      TF_VAR_password_reset_url: ${{ vars.PASSWORD_RESET_URL }}
      TF_VAR_registration_verification_url: ${{ vars.REGISTRATION_VERIFICATION_URL }}
      # Los cuatro UUID de plantilla de Resend del producto -verificacion de registro,
      # restablecimiento, invitacion de empleado y confirmacion de cita-. Dejan de ser un
      # default commiteado en el application.yml del backend: el identificador ya no viaja
      # dentro de la imagen y cada entorno apunta a las suyas. SIN prefijo: las lee del
      # environment del job. Van en los DOS bloques env, plan y apply: tenerlas en uno
      # solo hace divergir el plan del apply.
      TF_VAR_registration_verification_template_id: ${{ vars.REGISTRATION_VERIFICATION_TEMPLATE_ID }}
      TF_VAR_password_reset_template_id: ${{ vars.PASSWORD_RESET_TEMPLATE_ID }}
      TF_VAR_employee_invitation_template_id: ${{ vars.EMPLOYEE_INVITATION_TEMPLATE_ID }}
      TF_VAR_appointment_confirmation_template_id: ${{ vars.APPOINTMENT_CONFIRMATION_TEMPLATE_ID }}

    steps:
      - name: Check out immutable IaC revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Verify OTLP endpoint parity
        shell: pwsh
        run: ./.github/scripts/assert-telemetry-endpoint.ps1 -Environment prod -Source 'vars.GRAFANA_OTLP_ENDPOINT (environment iac-apply-prod)'

      - name: Validate AWS apply configuration
        shell: pwsh
        run: |
          if ($env:AWS_ACCOUNT_ID -notmatch '^\d{12}$') {
            throw "Configure AWS_ACCOUNT_ID con los 12 digitos de la cuenta AWS en iac-apply-prod."
          }

      - name: Configure apply AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy immutable image, verify and roll back on failure
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          ALLOW_ROLLBACK: ${{ inputs.allow_rollback }}
        shell: pwsh
        run: |
          ./scripts/deployment/backend-image.ps1 `
            -Mode Apply `
            -Environment prod `
            -Version $env:RELEASE_VERSION `
            -AllowRollback:($env:ALLOW_ROLLBACK -eq 'true')
