name: Terraform apply dev

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authorize-ref:
    name: Authorize GitFlow revision
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Enforce the development branch
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -ne 'refs/heads/develop') {
            throw "dev solo puede aplicarse desde refs/heads/develop; revision recibida: $env:GITHUB_REF."
          }

  apply:
    name: Approve, plan fresh and apply dev
    needs: authorize-ref
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: iac-apply-dev
    concurrency:
      group: terraform-dev
      cancel-in-progress: false
    env:
      DEPLOY_ENVIRONMENT: dev
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      AWS_ROLE_TO_ASSUME: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/vetsoftware-iac-apply-dev
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_STATE_KMS_KEY_ARN: ${{ vars.TF_STATE_KMS_KEY_ARN }}
      TF_VARS_JSON: ${{ vars.TF_VARS_JSON }}
      TF_VAR_api_domain_name: ${{ vars.API_DOMAIN_NAME }}
      TF_VAR_backend_image_uri: ${{ vars.BACKEND_IMAGE_URI }}
      TF_VAR_cors_allowed_origins: ${{ vars.CORS_ALLOWED_ORIGINS }}
      TF_VAR_email_from: ${{ vars.EMAIL_FROM }}
      TF_VAR_grafana_otlp_endpoint: ${{ vars.GRAFANA_OTLP_ENDPOINT }}
      TF_VAR_login_url: ${{ vars.LOGIN_URL }}
      TF_VAR_password_reset_url: ${{ vars.PASSWORD_RESET_URL }}
      TF_VAR_registration_verification_url: ${{ vars.REGISTRATION_VERIFICATION_URL }}
      TF_VAR_application_secrets_json: ${{ secrets.APPLICATION_SECRETS_JSON }}
      TF_VAR_cloudflare_tunnel_token: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
      TF_VAR_grafana_secrets_json: ${{ secrets.GRAFANA_SECRETS_JSON }}
      TF_IN_AUTOMATION: true
      TF_INPUT: false

    steps:
      - name: Check out authorized IaC revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Validate apply role configuration
        shell: pwsh
        run: |
          if ($env:AWS_ACCOUNT_ID -notmatch '^\d{12}$') {
            throw "Configure AWS_ACCOUNT_ID con los 12 digitos de la cuenta AWS en iac-apply-dev."
          }

      - name: Configure apply AWS credentials
        uses: aws-actions/configure-aws-credentials@451ce2a72e8d729a59ebeaacab82dbce58e7af4c # v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Generate and apply a fresh Terraform plan
        shell: pwsh
        run: ./.github/scripts/terraform-cycle.ps1 -Mode Apply -Environment dev
