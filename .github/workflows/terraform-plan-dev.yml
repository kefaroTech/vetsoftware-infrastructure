name: Terraform plan dev

on:
  pull_request:
    branches:
      - develop
    paths:
      - "environments/dev/**"
      - "modules/**"
      - ".github/scripts/terraform-*.ps1"
      # El manifiesto de endpoints y su verificador: cambiarlos tiene que disparar
      # el plan, que es donde se comprueba la paridad.
      - ".github/scripts/assert-telemetry-endpoint.ps1"
      - ".github/telemetry-endpoints.json"
      - ".github/workflows/terraform-plan-dev.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  plan:
    name: Plan dev
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # Un pull_request corre SIN environment a proposito. iac-plan-dev lleva una
    # deployment branch policy atada a develop, y la referencia de un PR
    # -refs/pull/N/merge- no es una rama: nunca coincide, asi que el job moria
    # antes del primer paso y el plan no llegaba nunca al PR. El rol de plan
    # admite ese sujeto sin environment; el de apply no.
    #
    # workflow_dispatch si conserva el environment, porque su referencia es una
    # rama y la politica la acepta.
    #
    # La condicion va invertida a proposito: en las expresiones de GitHub la
    # cadena vacia es falsy, asi que "== 'pull_request' && '' || 'iac-plan-dev'"
    # cae siempre en la ultima rama y el environment nunca se soltaria. El valor
    # no vacio tiene que ir en el lado verdadero.
    environment: ${{ github.event_name != 'pull_request' && 'iac-plan-dev' || '' }}
    concurrency:
      group: terraform-dev
      cancel-in-progress: false
    # Las vars van prefijadas y viven en el repositorio, no en el environment:
    # un job sin environment no puede leer las de iac-plan-dev, y el scope de
    # repositorio es plano, asi que dev y prod chocarian sin el prefijo.
    env:
      DEPLOY_ENVIRONMENT: dev
      AWS_REGION: ${{ vars.DEV_AWS_REGION || 'us-east-1' }}
      AWS_ACCOUNT_ID: ${{ vars.DEV_AWS_ACCOUNT_ID }}
      AWS_ROLE_TO_ASSUME: arn:aws:iam::${{ vars.DEV_AWS_ACCOUNT_ID }}:role/vetsoftware-iac-plan-dev
      TF_STATE_BUCKET: ${{ vars.DEV_TF_STATE_BUCKET }}
      TF_STATE_KMS_KEY_ARN: ${{ vars.DEV_TF_STATE_KMS_KEY_ARN }}
      TF_VARS_JSON: ${{ vars.DEV_TF_VARS_JSON }}
      TF_VAR_api_domain_name: ${{ vars.DEV_API_DOMAIN_NAME }}
      TF_VAR_backend_image_uri: ${{ vars.DEV_BACKEND_IMAGE_URI }}
      TF_VAR_cors_allowed_origins: ${{ vars.DEV_CORS_ALLOWED_ORIGINS }}
      TF_VAR_email_from: ${{ vars.DEV_EMAIL_FROM }}
      TF_VAR_grafana_otlp_endpoint: ${{ vars.DEV_GRAFANA_OTLP_ENDPOINT }}
      TF_VAR_login_url: ${{ vars.DEV_LOGIN_URL }}
      TF_VAR_password_reset_url: ${{ vars.DEV_PASSWORD_RESET_URL }}
      # Alta de superadministradores de plataforma: sin estas cuatro el root de dev
      # no planifica -no tienen default- y el check del PR muere con "No value for
      # required variable". Van con prefijo DEV_ y desde el repositorio como el resto
      # de este bloque: en pull_request el environment queda vacio y las vars de
      # iac-plan-dev no se pueden leer.
      TF_VAR_platform_access_login_url: ${{ vars.DEV_PLATFORM_ACCESS_LOGIN_URL }}
      TF_VAR_platform_access_review_base_url: ${{ vars.DEV_PLATFORM_ACCESS_REVIEW_BASE_URL }}
      TF_VAR_platform_approver_email: ${{ vars.DEV_PLATFORM_APPROVER_EMAIL }}
      TF_VAR_platform_invitation_base_url: ${{ vars.DEV_PLATFORM_INVITATION_BASE_URL }}
      # Los cuatro UUID de plantilla de Resend del mismo alta. Las plantillas se crean
      # A MANO en el panel de Resend; aqui solo viaja el identificador. El bean valida
      # las OCHO claves de vetsoftware.platform-access de una sola vez, asi que faltar
      # una plantilla tumba el arranque igual que faltar una URL. Con prefijo DEV_ y desde
      # el repositorio, como las cuatro de arriba.
      TF_VAR_platform_access_request_template_id: ${{ vars.DEV_PLATFORM_ACCESS_REQUEST_TEMPLATE_ID }}
      TF_VAR_platform_access_approved_template_id: ${{ vars.DEV_PLATFORM_ACCESS_APPROVED_TEMPLATE_ID }}
      TF_VAR_platform_access_rejected_template_id: ${{ vars.DEV_PLATFORM_ACCESS_REJECTED_TEMPLATE_ID }}
      TF_VAR_platform_access_welcome_template_id: ${{ vars.DEV_PLATFORM_ACCESS_WELCOME_TEMPLATE_ID }}
      TF_VAR_registration_verification_url: ${{ vars.DEV_REGISTRATION_VERIFICATION_URL }}
      # log_shipping_enabled viene en true y la validacion de
      # grafana_logs_access_key -formato <loki_instance_id>:<token>, regex
      # ^[0-9]+:.+$ en environments/dev/variables.tf:539- corre en tiempo de
      # plan, no de apply: sin un valor con ese formato el ciclo muere con
      # "Invalid value for variable" antes de leer nada de AWS.
      #
      # El camino de pull_request recibe un valor SINTETICO, no la credencial.
      # Este job corre sin environment cuando lo dispara un PR (ver arriba), asi
      # que cualquier secreto puesto aqui tendria que ser de repositorio y
      # quedaria dentro del alcance del codigo que la propia PR propone: basta
      # un paso `run:` anadido en la rama para exfiltrarlo, y sin environment no
      # hay deployment branch policy que intervenga. El plan solo comprueba el
      # formato -el valor real nunca entra en el state: modules/secrets usa
      # secret_string_wo con version, asi que un valor sintetico tampoco produce
      # diff- de modo que la credencial viva no hace falta aqui.
      #
      # El valor real queda en los cuatro jobs que SI corren siempre con
      # environment: terraform-apply-dev (iac-apply-dev), terraform-drift-dev
      # (iac-plan-dev) y las dos fases de deploy-backend-dev. Con esto el secret
      # puede moverse de repositorio a los environments iac-plan-dev e
      # iac-apply-dev sin tocar ningun workflow; mientras siga a nivel de
      # repositorio esta expresion lo lee igual.
      TF_VAR_grafana_logs_access_key: ${{ github.event_name == 'pull_request' && '000000:pull-request-placeholder' || secrets.TF_VAR_GRAFANA_LOGS_ACCESS_KEY }}
      TF_IN_AUTOMATION: true
      TF_INPUT: false

    steps:
      - name: Check out proposed IaC revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Este job lee la variable de repositorio prefijada; apply, drift y el
      # circuito de imagen leen la del Environment. Nada obliga a los dos scopes a
      # coincidir, y cuando divergieron lo aprobado aqui no era lo que se aplicaba.
      - name: Verify OTLP endpoint parity
        shell: pwsh
        run: ./.github/scripts/assert-telemetry-endpoint.ps1 -Environment dev -Source 'vars.DEV_GRAFANA_OTLP_ENDPOINT (repositorio)'

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Validate plan role configuration
        shell: pwsh
        run: |
          if ($env:AWS_ACCOUNT_ID -notmatch '^\d{12}$') {
            throw "Configure AWS_ACCOUNT_ID con los 12 digitos de la cuenta AWS en iac-plan-dev."
          }

      - name: Configure read-only AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Generate fresh Terraform plan
        id: terraform-plan
        shell: pwsh
        run: ./.github/scripts/terraform-cycle.ps1 -Mode Plan -Environment dev

      - name: Publish plan in pull request
        if: github.event_name == 'pull_request' && steps.terraform-plan.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          PLAN_REPORT_PATH: ${{ steps.terraform-plan.outputs.report_path }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: pwsh
        run: |
          ./.github/scripts/publish-terraform-plan.ps1 `
            -Environment dev `
            -ReportPath $env:PLAN_REPORT_PATH `
            -Repository $env:GITHUB_REPOSITORY `
            -PullRequestNumber $env:PR_NUMBER `
            -Token $env:GH_TOKEN
