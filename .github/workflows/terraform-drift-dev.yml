name: Terraform drift dev

on:
  schedule:
    # Vuelve a ser diaria. Se bajo a semanal porque el informe repetia cada dia
    # la misma deriva conocida -el apagado programado de EventBridge mueve el
    # servicio ECS y la instancia RDS, y el proveedor de AWS reescribe dos
    # atributos de module.cost_report-, pero bajar la cadencia no quitaba el
    # ruido: solo lo espaciaba, y de paso dejaba la deriva real seis dias sin
    # mirar. El ruido lo filtra ahora scripts/quality/drift-triage.ps1, que
    # silencia esas cuatro direcciones por atributo exacto y deja en rojo todo
    # lo demas, asi que la cadencia diaria vuelve a tener sentido.
    #
    # Los eventos schedule de GitHub no son puntuales: medido en este
    # repositorio, este cron ha llegado a dispararse con seis horas de retraso.
    # No importa para la deriva, que es una foto y no un plazo.
    - cron: "17 11 * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  # El vigilante avisa abriendo un issue cuando encuentra deriva sin clasificar
  # o cuando el propio ciclo se cae. Sin este permiso el aviso no sale y el
  # workflow vuelve a ser el vigilante mudo que estuvo diez ciclos en rojo sin
  # que nadie se enterara.
  issues: write

jobs:
  drift:
    name: Detect drift in dev
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: iac-plan-dev
    concurrency:
      group: terraform-dev
      cancel-in-progress: false
    env:
      DEPLOY_ENVIRONMENT: dev
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      AWS_ROLE_TO_ASSUME: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/vetsoftware-iac-plan-dev
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_STATE_KMS_KEY_ARN: ${{ vars.TF_STATE_KMS_KEY_ARN }}
      TF_VARS_JSON: ${{ vars.TF_VARS_JSON }}
      TF_VAR_api_domain_name: ${{ vars.API_DOMAIN_NAME }}
      TF_VAR_backend_image_uri: ${{ vars.BACKEND_IMAGE_URI }}
      TF_VAR_cors_allowed_origins: ${{ vars.CORS_ALLOWED_ORIGINS }}
      TF_VAR_email_from: ${{ vars.EMAIL_FROM }}
      TF_VAR_grafana_otlp_endpoint: ${{ vars.GRAFANA_OTLP_ENDPOINT }}
      TF_VAR_login_url: ${{ vars.LOGIN_URL }}
      TF_VAR_password_reset_url: ${{ vars.PASSWORD_RESET_URL }}
      # Alta de superadministradores de plataforma. Sin estas cuatro el plan de deriva
      # ni siquiera arranca -no tienen default- y su rojo se confundiria con deriva
      # real. SIN prefijo: el job declara environment: iac-plan-dev y lee sus vars.
      TF_VAR_platform_access_login_url: ${{ vars.PLATFORM_ACCESS_LOGIN_URL }}
      TF_VAR_platform_access_review_base_url: ${{ vars.PLATFORM_ACCESS_REVIEW_BASE_URL }}
      TF_VAR_platform_approver_email: ${{ vars.PLATFORM_APPROVER_EMAIL }}
      TF_VAR_platform_invitation_base_url: ${{ vars.PLATFORM_INVITATION_BASE_URL }}
      TF_VAR_registration_verification_url: ${{ vars.REGISTRATION_VERIFICATION_URL }}
      # El drift ejecuta un plan completo: la validacion de formato de
      # grafana_logs_access_key tambien lo detiene, asi que necesita el valor.
      #
      # Aqui SI va la credencial real, sin rodeos: este job corre siempre con
      # environment -iac-plan-dev, atado a develop, y el cron dispara sobre
      # develop-, de modo que nunca queda expuesto a la superficie de un
      # pull_request. Hoy el secret esta a nivel de repositorio y por eso se lee
      # igual; cuando se mueva a los environments iac-plan-dev / iac-apply-dev,
      # que es donde deberia estar, esta linea sigue valiendo sin cambios. El
      # camino de PR de terraform-plan-dev.yml usa un valor sintetico
      # precisamente para que ese movimiento sea posible.
      TF_VAR_grafana_logs_access_key: ${{ secrets.TF_VAR_GRAFANA_LOGS_ACCESS_KEY }}
      TF_IN_AUTOMATION: true
      TF_INPUT: false

    steps:
      - name: Check out the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Un endpoint divergente aqui no rompe el ciclo: produce deriva que no existe,
      # que es peor porque parece un hallazgo. Se verifica antes de tocar AWS.
      - name: Verify OTLP endpoint parity
        shell: pwsh
        run: ./.github/scripts/assert-telemetry-endpoint.ps1 -Environment dev -Source 'vars.GRAFANA_OTLP_ENDPOINT (environment iac-plan-dev)'

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Validate drift role configuration
        shell: pwsh
        run: |
          if ($env:AWS_ACCOUNT_ID -notmatch '^\d{12}$') {
            throw "Configure AWS_ACCOUNT_ID con los 12 digitos de la cuenta AWS en iac-plan-dev."
          }

      - name: Configure read-only AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      # El triage envuelve al ciclo: lo ejecuta igual -plan -refresh-only, jamas
      # apply- y clasifica lo que sale. La deriva declarada como conocida no
      # tumba el job; cualquier otra cosa si, incluido un objeto borrado en AWS
      # o un fallo del propio ciclo. La tabla de lo silenciado, con su motivo,
      # esta en el encabezado del script.
      - name: Detect and triage drift
        id: drift
        shell: pwsh
        run: ./scripts/quality/drift-triage.ps1 -Environment dev

      # failure() y no failure() del paso anterior: si lo que se rompe es el
      # checkout, las credenciales o el propio runner, tambien hay que avisarlo.
      # Ese caso es peor que la deriva, porque significa que nadie esta mirando.
      - name: Notify unresolved drift
        if: failure()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          DRIFT_STATUS: ${{ steps.drift.outputs.status }}
          DRIFT_REPORT_PATH: ${{ steps.drift.outputs.report_path }}
          DRIFT_FINGERPRINT: ${{ steps.drift.outputs.fingerprint }}
          # Vive en el environment iac-apply-dev, no en iac-plan-dev, asi que
          # aqui llega vacio y el aviso va solo por issue. Se deja declarado
          # para que copiar el secret al environment de plan sea todo lo que
          # haga falta para encender tambien el canal de Slack.
          SLACK_WEBHOOK_URL: ${{ secrets.VETSOFTWARE_GRAFANA_SLACK_WEBHOOK_URL }}
        run: |
          ./scripts/quality/drift-alert.ps1 `
            -Environment dev `
            -Status "$env:DRIFT_STATUS" `
            -ReportPath "$env:DRIFT_REPORT_PATH" `
            -Repository $env:GITHUB_REPOSITORY `
            -RunUrl "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID" `
            -Token $env:GH_TOKEN `
            -SlackWebhookUrl "$env:SLACK_WEBHOOK_URL" `
            -Fingerprint "$env:DRIFT_FINGERPRINT"
