name: Terraform drift dev

on:
  schedule:
    # Cadencia bajada de diaria a semanal: hay deriva permanente sin resolver en
    # module.cost_report.* y en module.database.aws_db_instance -esta ultima la
    # provoca el propio apagado programado de EventBridge-, asi que el informe
    # diario solo repetia hallazgos conocidos. Volver a subirla al resolverlos.
    - cron: "17 11 * * MON"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  drift:
    name: Detect drift in dev
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: iac-plan-dev
    concurrency:
      group: terraform-dev
      cancel-in-progress: false
    env:
      DEPLOY_ENVIRONMENT: dev
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      AWS_ROLE_TO_ASSUME: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/vetsoftware-iac-plan-dev
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_STATE_KMS_KEY_ARN: ${{ vars.TF_STATE_KMS_KEY_ARN }}
      TF_VARS_JSON: ${{ vars.TF_VARS_JSON }}
      TF_VAR_api_domain_name: ${{ vars.API_DOMAIN_NAME }}
      TF_VAR_backend_image_uri: ${{ vars.BACKEND_IMAGE_URI }}
      TF_VAR_cors_allowed_origins: ${{ vars.CORS_ALLOWED_ORIGINS }}
      TF_VAR_email_from: ${{ vars.EMAIL_FROM }}
      TF_VAR_grafana_otlp_endpoint: ${{ vars.GRAFANA_OTLP_ENDPOINT }}
      TF_VAR_login_url: ${{ vars.LOGIN_URL }}
      TF_VAR_password_reset_url: ${{ vars.PASSWORD_RESET_URL }}
      TF_VAR_registration_verification_url: ${{ vars.REGISTRATION_VERIFICATION_URL }}
      # El drift ejecuta un plan completo: la validacion de grafana_logs_access_key
      # tambien lo detiene. Secret de repositorio, compartido con plan y apply.
      TF_VAR_grafana_logs_access_key: ${{ secrets.TF_VAR_GRAFANA_LOGS_ACCESS_KEY }}
      TF_IN_AUTOMATION: true
      TF_INPUT: false

    steps:
      - name: Check out the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Un endpoint divergente aqui no rompe el ciclo: produce deriva que no existe,
      # que es peor porque parece un hallazgo. Se verifica antes de tocar AWS.
      - name: Verify OTLP endpoint parity
        shell: pwsh
        run: ./.github/scripts/assert-telemetry-endpoint.ps1 -Environment dev -Source 'vars.GRAFANA_OTLP_ENDPOINT (environment iac-plan-dev)'

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Validate drift role configuration
        shell: pwsh
        run: |
          if ($env:AWS_ACCOUNT_ID -notmatch '^\d{12}$') {
            throw "Configure AWS_ACCOUNT_ID con los 12 digitos de la cuenta AWS en iac-plan-dev."
          }

      - name: Configure read-only AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Detect drift without applying
        shell: pwsh
        run: ./.github/scripts/terraform-cycle.ps1 -Mode Drift -Environment dev
