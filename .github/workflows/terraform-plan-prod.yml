name: Terraform plan prod

on:
  pull_request:
    branches:
      - main
    paths:
      - "environments/prod/**"
      - "modules/**"
      - ".github/scripts/terraform-*.ps1"
      - ".github/workflows/terraform-plan-prod.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  plan:
    name: Plan prod
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # Mismo motivo que en dev: iac-plan-prod esta atado a main y release/**, y la
    # referencia de un PR no es una rama, asi que el job moria antes del primer
    # paso. Un PR corre sin environment -el rol de plan admite ese sujeto- y
    # workflow_dispatch lo conserva, porque su referencia si es una rama.
    # Condicion invertida a proposito: la cadena vacia es falsy en las
    # expresiones de GitHub, asi que el valor no vacio debe ir en el lado
    # verdadero o el environment no se suelta nunca.
    environment: ${{ github.event_name != 'pull_request' && 'iac-plan-prod' || '' }}
    concurrency:
      group: terraform-prod
      cancel-in-progress: false
    # Prefijadas y a nivel de repositorio: sin environment no se leen las de
    # iac-plan-prod, y el scope de repositorio es plano, asi que sin el prefijo
    # prod pisaria los valores de dev.
    env:
      DEPLOY_ENVIRONMENT: prod
      AWS_REGION: ${{ vars.PROD_AWS_REGION || 'us-east-1' }}
      AWS_ACCOUNT_ID: ${{ vars.PROD_AWS_ACCOUNT_ID }}
      AWS_ROLE_TO_ASSUME: arn:aws:iam::${{ vars.PROD_AWS_ACCOUNT_ID }}:role/vetsoftware-iac-plan-prod
      TF_STATE_BUCKET: ${{ vars.PROD_TF_STATE_BUCKET }}
      TF_STATE_KMS_KEY_ARN: ${{ vars.PROD_TF_STATE_KMS_KEY_ARN }}
      TF_VARS_JSON: ${{ vars.PROD_TF_VARS_JSON }}
      TF_VAR_api_domain_name: ${{ vars.PROD_API_DOMAIN_NAME }}
      TF_VAR_backend_image_uri: ${{ vars.PROD_BACKEND_IMAGE_URI }}
      TF_VAR_cors_allowed_origins: ${{ vars.PROD_CORS_ALLOWED_ORIGINS }}
      TF_VAR_email_from: ${{ vars.PROD_EMAIL_FROM }}
      TF_VAR_grafana_otlp_endpoint: ${{ vars.PROD_GRAFANA_OTLP_ENDPOINT }}
      TF_VAR_login_url: ${{ vars.PROD_LOGIN_URL }}
      TF_VAR_password_reset_url: ${{ vars.PROD_PASSWORD_RESET_URL }}
      TF_VAR_registration_verification_url: ${{ vars.PROD_REGISTRATION_VERIFICATION_URL }}
      TF_IN_AUTOMATION: true
      TF_INPUT: false

    steps:
      - name: Check out proposed IaC revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Validate plan role configuration
        shell: pwsh
        run: |
          if ($env:AWS_ACCOUNT_ID -notmatch '^\d{12}$') {
            throw "Configure AWS_ACCOUNT_ID con los 12 digitos de la cuenta AWS en iac-plan-prod."
          }

      - name: Configure read-only AWS credentials
        uses: aws-actions/configure-aws-credentials@451ce2a72e8d729a59ebeaacab82dbce58e7af4c # v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Generate fresh Terraform plan
        id: terraform-plan
        shell: pwsh
        run: ./.github/scripts/terraform-cycle.ps1 -Mode Plan -Environment prod

      - name: Publish plan in pull request
        if: github.event_name == 'pull_request' && steps.terraform-plan.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          PLAN_REPORT_PATH: ${{ steps.terraform-plan.outputs.report_path }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: pwsh
        run: |
          ./.github/scripts/publish-terraform-plan.ps1 `
            -Environment prod `
            -ReportPath $env:PLAN_REPORT_PATH `
            -Repository $env:GITHUB_REPOSITORY `
            -PullRequestNumber $env:PR_NUMBER `
            -Token $env:GH_TOKEN
