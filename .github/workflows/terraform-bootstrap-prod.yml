name: Terraform bootstrap prod

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authorize-ref:
    name: Authorize production bootstrap revision
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Enforce main
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -ne 'refs/heads/main') {
            throw "El bootstrap prod solo puede ejecutarse desde refs/heads/main."
          }

  bootstrap:
    name: Provision isolated prod bootstrap
    needs: authorize-ref
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: iac-bootstrap-prod
    concurrency:
      group: terraform-bootstrap-prod
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      PROJECT_NAME: vetsoftware
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      AWS_ROLE_TO_ASSUME: ${{ vars.AWS_BOOTSTRAP_ROLE_ARN }}
      GH_ORGANIZATION: ${{ github.repository_owner }}
      GH_ORGANIZATION_ID: ${{ vars.GH_ORGANIZATION_ID }}
      GH_REPOSITORY_IDS_JSON: ${{ vars.GH_REPOSITORY_IDS_JSON }}

    steps:
      - name: Check out authorized bootstrap revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Validate bootstrap identity configuration
        shell: pwsh
        run: |
          foreach ($name in @('AWS_ACCOUNT_ID', 'AWS_ROLE_TO_ASSUME', 'GH_ORGANIZATION_ID', 'GH_REPOSITORY_IDS_JSON')) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw "Configure $name en iac-bootstrap-prod."
            }
          }

      - name: Configure isolated prod bootstrap credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}
          role-session-name: vetsoftware-bootstrap-prod-${{ github.run_id }}

      - name: Bootstrap prod with remote state
        shell: pwsh
        run: ./.github/scripts/terraform-bootstrap.ps1 -Environment prod
