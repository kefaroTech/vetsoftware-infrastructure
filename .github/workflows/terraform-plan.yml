name: Terraform plan

on:
  pull_request:
    branches:
      - develop
      - main
    paths:
      - "**/*.tf"
      - "**/.terraform.lock.hcl"
      - ".github/scripts/terraform-*.ps1"
      - ".github/workflows/terraform*.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options:
          - dev
          - prod

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  plan:
    name: Plan ${{ github.event_name == 'pull_request' && (github.base_ref == 'main' && 'prod' || 'dev') || inputs.environment }}
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: iac-plan-${{ github.event_name == 'pull_request' && (github.base_ref == 'main' && 'prod' || 'dev') || inputs.environment }}
    concurrency:
      group: terraform-${{ github.event_name == 'pull_request' && (github.base_ref == 'main' && 'prod' || 'dev') || inputs.environment }}
      cancel-in-progress: false
    env:
      DEPLOY_ENVIRONMENT: ${{ github.event_name == 'pull_request' && (github.base_ref == 'main' && 'prod' || 'dev') || inputs.environment }}
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      AWS_ROLE_TO_ASSUME: ${{ vars.AWS_IAC_ROLE_ARN }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_STATE_KMS_KEY_ARN: ${{ vars.TF_STATE_KMS_KEY_ARN }}
      TF_VARS_JSON: ${{ vars.TF_VARS_JSON }}
      TF_VAR_api_domain_name: ${{ vars.API_DOMAIN_NAME }}
      TF_VAR_backend_image_uri: ${{ vars.BACKEND_IMAGE_URI }}
      TF_VAR_cors_allowed_origins: ${{ vars.CORS_ALLOWED_ORIGINS }}
      TF_VAR_email_from: ${{ vars.EMAIL_FROM }}
      TF_VAR_grafana_otlp_endpoint: ${{ vars.GRAFANA_OTLP_ENDPOINT }}
      TF_VAR_login_url: ${{ vars.LOGIN_URL }}
      TF_VAR_password_reset_url: ${{ vars.PASSWORD_RESET_URL }}
      TF_VAR_registration_verification_url: ${{ vars.REGISTRATION_VERIFICATION_URL }}
      TF_IN_AUTOMATION: true
      TF_INPUT: false

    steps:
      - name: Check out proposed IaC revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Validate plan role configuration
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:AWS_ROLE_TO_ASSUME)) {
            throw "Configure AWS_IAC_ROLE_ARN in iac-plan-$env:DEPLOY_ENVIRONMENT."
          }

      - name: Configure read-only AWS credentials
        uses: aws-actions/configure-aws-credentials@451ce2a72e8d729a59ebeaacab82dbce58e7af4c # v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Generate fresh Terraform plan
        id: terraform-plan
        shell: pwsh
        run: ./.github/scripts/terraform-cycle.ps1 -Mode Plan -Environment $env:DEPLOY_ENVIRONMENT

      - name: Publish plan in pull request
        if: github.event_name == 'pull_request' && steps.terraform-plan.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          PLAN_REPORT_PATH: ${{ steps.terraform-plan.outputs.report_path }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: pwsh
        run: |
          ./.github/scripts/publish-terraform-plan.ps1 `
            -Environment $env:DEPLOY_ENVIRONMENT `
            -ReportPath $env:PLAN_REPORT_PATH `
            -Repository $env:GITHUB_REPOSITORY `
            -PullRequestNumber $env:PR_NUMBER `
            -Token $env:GH_TOKEN
