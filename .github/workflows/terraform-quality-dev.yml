name: Terraform quality dev

# Este workflow absorbio las raices de bootstrap: antes existia un
# 'Terraform quality bootstrap dev' aparte que corria el mismo gate, con el
# mismo -Mode ci, las mismas acciones y los mismos permisos, solo que sobre
# bootstrap, modules/ecr y modules/github_iac_roles. Eran dos arranques de
# runner para un trabajo que cabe en una sola invocacion. NO volver a partirlo
# en dos: si se anade una raiz, va en el -Roots del ultimo paso, y su ruta en
# el paths: de arriba.

on:
  pull_request:
    branches:
      - develop
    paths:
      - "environments/dev/**"
      - "modules/**"
      - "bootstrap/**"
      - "scripts/quality/**"
      - "scripts/security/**"
      - ".tflint.hcl"
      - ".terraform-version"
      - ".github/scripts/terraform-*.ps1"
      - ".github/workflows/terraform-bootstrap-dev.yml"
      - ".github/workflows/terraform-quality-dev.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraform-quality-dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Format, lint and validate dev and bootstrap
    runs-on: ubuntu-24.04
    # 45 y no 30: este job hace ahora el trabajo que antes se repartian dos, cada
    # uno con su presupuesto de 30 minutos.
    timeout-minutes: 45
    env:
      TF_IN_AUTOMATION: true
      TF_INPUT: false

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Set up TFLint
        uses: terraform-linters/setup-tflint@6e1e0642c0289bd619021bf6b34e3c08ed1e005a # v6.3.0
        with:
          tflint_version: v0.64.0
          github_token: ${{ github.token }}

      - name: Run the quality gate for the dev and bootstrap roots
        # Sin token, la descarga del plugin de TFLint va sin autenticar contra
        # la API de GitHub y comparte el limite de 60 por hora con las demas IP
        # del runner: el gate se cae con un 403 que no tiene nada que ver con el
        # codigo. Con el token del run el limite pasa a ser propio.
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: pwsh
        run: >-
          ./scripts/quality/terraform-gate.ps1 -Mode ci
          -Roots environments/dev,bootstrap,modules/ecr,modules/github_iac_roles,modules/log_shipping
