name: Terraform drift prod

# Repuesto el 19 de agosto de 2026 a partir del fichero borrado en 5374190
# ("recortar minutos de Actions"), no reescrito de cero. Se borro porque
# acumulaba 14 ejecuciones y 0 exitos, y la causa estaba bien diagnosticada:
# los cron de GitHub corren SIEMPRE sobre la rama por defecto -aqui develop- y
# el environment iac-plan-prod lleva una deployment branch policy que solo
# admite main, asi que el job se rechazaba antes del primer paso.
#
# Esa causa sigue viva hoy, verificada contra la API el 19 de agosto de 2026:
#
#   - iac-plan-prod → deployment branch policy: unicamente "main".
#   - El rol vetsoftware-iac-plan-prod solo acepta dos sujetos OIDC
#     (modules/github_iac_roles/main.tf:290-293): el del environment y el de un
#     job de pull_request sin environment. Un job de schedule sin environment
#     -sujeto ref:refs/heads/develop- no puede asumirlo, asi que soltar el
#     environment tampoco arregla nada.
#   - No existe ninguna variable de prod, ni a nivel de repositorio ni en
#     iac-plan-prod: sin AWS_ACCOUNT_ID no hay a que cuenta mirar.
#
# Por eso el cron llega gateado por PROD_DRIFT_ENABLED. Mientras esa variable no
# valga 'true', la ejecucion programada se SALTA en vez de fallar: un rojo
# diario que nadie puede arreglar desde el repositorio es exactamente el ruido
# que hizo que nadie mirara el vigilante de dev durante diez ciclos. En cuanto
# se resuelva el bloqueo -variables de prod cargadas y, o bien develop anadido a
# la politica de rama de iac-plan-prod, o bien el sujeto del cron admitido en el
# rol de plan- basta poner la variable a 'true' para que el vigilante arranque.
# workflow_dispatch desde main no depende de nada de eso y funciona hoy.

on:
  schedule:
    # Media hora despues del de dev, para no cruzar dos ciclos de Terraform en
    # el mismo pool de runners.
    - cron: "47 11 * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  # Mismo motivo que en dev: el vigilante avisa abriendo un issue.
  issues: write

jobs:
  drift:
    name: Detect drift in prod
    # Ver la nota de arriba. workflow_dispatch pasa siempre; el cron solo cuando
    # alguien ha verificado que prod puede planificarse de verdad.
    if: github.event_name != 'schedule' || vars.PROD_DRIFT_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: iac-plan-prod
    concurrency:
      group: terraform-prod
      cancel-in-progress: false
    env:
      DEPLOY_ENVIRONMENT: prod
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      AWS_ROLE_TO_ASSUME: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/vetsoftware-iac-plan-prod
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_STATE_KMS_KEY_ARN: ${{ vars.TF_STATE_KMS_KEY_ARN }}
      TF_VARS_JSON: ${{ vars.TF_VARS_JSON }}
      TF_VAR_api_domain_name: ${{ vars.API_DOMAIN_NAME }}
      TF_VAR_backend_image_uri: ${{ vars.BACKEND_IMAGE_URI }}
      TF_VAR_cors_allowed_origins: ${{ vars.CORS_ALLOWED_ORIGINS }}
      TF_VAR_email_from: ${{ vars.EMAIL_FROM }}
      TF_VAR_grafana_otlp_endpoint: ${{ vars.GRAFANA_OTLP_ENDPOINT }}
      TF_VAR_login_url: ${{ vars.LOGIN_URL }}
      TF_VAR_password_reset_url: ${{ vars.PASSWORD_RESET_URL }}
      TF_VAR_registration_verification_url: ${{ vars.REGISTRATION_VERIFICATION_URL }}
      # DIFERENCIA INTENCIONAL con dev: no se inyecta
      # TF_VAR_grafana_logs_access_key. environments/prod no declara esa
      # variable -el envio durable de logs es de dev- y pasarla haria fallar el
      # plan con "Value for undeclared variable".
      TF_IN_AUTOMATION: true
      TF_INPUT: false

    steps:
      - name: Check out the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Un endpoint divergente aqui no rompe el ciclo: produce deriva que no existe,
      # que es peor porque parece un hallazgo. Se verifica antes de tocar AWS.
      # Prod todavia no tiene stack de Grafana Cloud ni valor canonico: el check
      # avisa y deja pasar.
      - name: Verify OTLP endpoint parity
        shell: pwsh
        run: ./.github/scripts/assert-telemetry-endpoint.ps1 -Environment prod -Source 'vars.GRAFANA_OTLP_ENDPOINT (environment iac-plan-prod)'

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Validate drift role configuration
        shell: pwsh
        run: |
          if ($env:AWS_ACCOUNT_ID -notmatch '^\d{12}$') {
            throw "Configure AWS_ACCOUNT_ID con los 12 digitos de la cuenta AWS en iac-plan-prod."
          }

      - name: Configure read-only AWS credentials
        # Mismo pin que el resto del pipeline. El fichero borrado se quedo en
        # 451ce2a, una version anterior de la misma accion.
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      # Igual que en dev: el triage ejecuta el mismo ciclo -refresh-only, jamas
      # apply- y clasifica. En prod la tabla de deriva conocida solo silencia lo
      # que produce el proveedor de AWS; el apagado programado es de dev y aqui
      # no aplica, asi que un ECS escalado a cero en produccion si seria rojo.
      - name: Detect and triage drift
        id: drift
        shell: pwsh
        run: ./scripts/quality/drift-triage.ps1 -Environment prod

      - name: Notify unresolved drift
        if: failure()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          DRIFT_STATUS: ${{ steps.drift.outputs.status }}
          DRIFT_REPORT_PATH: ${{ steps.drift.outputs.report_path }}
          DRIFT_FINGERPRINT: ${{ steps.drift.outputs.fingerprint }}
          # Igual que en dev: hoy el webhook vive en iac-apply-prod y aqui llega
          # vacio, asi que el aviso va por issue. Declarado para que copiarlo al
          # environment de plan sea suficiente.
          SLACK_WEBHOOK_URL: ${{ secrets.VETSOFTWARE_GRAFANA_SLACK_WEBHOOK_URL }}
        run: |
          ./scripts/quality/drift-alert.ps1 `
            -Environment prod `
            -Status "$env:DRIFT_STATUS" `
            -ReportPath "$env:DRIFT_REPORT_PATH" `
            -Repository $env:GITHUB_REPOSITORY `
            -RunUrl "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID" `
            -Token $env:GH_TOKEN `
            -SlackWebhookUrl "$env:SLACK_WEBHOOK_URL" `
            -Fingerprint "$env:DRIFT_FINGERPRINT"
