name: Terraform apply prod

on:
  workflow_dispatch:
    inputs:
      backend_image_uri:
        description: "Opcional. Digest a desplegar cuando la imagen en ejecucion esta rota y el ciclo no debe heredarla. Vacio = conservar la activa."
        required: false
        type: string

permissions:
  contents: read

jobs:
  authorize-ref:
    name: Authorize GitFlow revision
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Enforce the production branch
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -ne 'refs/heads/main') {
            throw "prod solo puede aplicarse desde refs/heads/main; revision recibida: $env:GITHUB_REF."
          }

  apply:
    name: Approve, plan fresh and apply prod
    needs: authorize-ref
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: iac-apply-prod
    concurrency:
      group: terraform-prod
      cancel-in-progress: false
    env:
      DEPLOY_ENVIRONMENT: prod
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      AWS_ROLE_TO_ASSUME: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/vetsoftware-iac-apply-prod
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_STATE_KMS_KEY_ARN: ${{ vars.TF_STATE_KMS_KEY_ARN }}
      TF_VARS_JSON: ${{ vars.TF_VARS_JSON }}
      TF_VAR_api_domain_name: ${{ vars.API_DOMAIN_NAME }}
      TF_VAR_backend_image_uri: ${{ vars.BACKEND_IMAGE_URI }}
      TF_VAR_cors_allowed_origins: ${{ vars.CORS_ALLOWED_ORIGINS }}
      TF_VAR_email_from: ${{ vars.EMAIL_FROM }}
      TF_VAR_grafana_otlp_endpoint: ${{ vars.GRAFANA_OTLP_ENDPOINT }}
      TF_VAR_login_url: ${{ vars.LOGIN_URL }}
      TF_VAR_password_reset_url: ${{ vars.PASSWORD_RESET_URL }}
      TF_VAR_registration_verification_url: ${{ vars.REGISTRATION_VERIFICATION_URL }}
      # Los cuatro UUID de plantilla de Resend del producto -verificacion de registro,
      # restablecimiento, invitacion de empleado y confirmacion de cita-. Dejan de ser un
      # default commiteado en el application.yml del backend: el identificador ya no viaja
      # dentro de la imagen y cada entorno apunta a las suyas. SIN prefijo: las lee del
      # environment del job.
      TF_VAR_registration_verification_template_id: ${{ vars.REGISTRATION_VERIFICATION_TEMPLATE_ID }}
      TF_VAR_password_reset_template_id: ${{ vars.PASSWORD_RESET_TEMPLATE_ID }}
      TF_VAR_employee_invitation_template_id: ${{ vars.EMPLOYEE_INVITATION_TEMPLATE_ID }}
      TF_VAR_appointment_confirmation_template_id: ${{ vars.APPOINTMENT_CONFIRMATION_TEMPLATE_ID }}
      # Un secreto de GitHub por secreto de runtime. Antes eran dos blobs JSON
      # -APPLICATION_SECRETS_JSON y GRAFANA_SECRETS_JSON- armados a mano; el JSON
      # lo compone ahora modules/secrets y aqui solo viajan valores.
      #
      # OTEL_EXPORTER_OTLP_HEADERS es NUEVA en produccion: el secreto de Grafana
      # de prod tenia solo las dos credenciales que Alloy extrae con jq, pero el
      # modulo es compartido y compone el JSON entero.
      TF_VAR_jwt_secret: ${{ secrets.JWT_SECRET }}
      TF_VAR_resend_api_key: ${{ secrets.RESEND_API_KEY }}
      TF_VAR_recaptcha_secret: ${{ secrets.RECAPTCHA_SECRET }}
      TF_VAR_dian_enc_key: ${{ secrets.DIAN_ENC_KEY }}
      TF_VAR_otlp_username: ${{ secrets.OTLP_USERNAME }}
      TF_VAR_otlp_api_key: ${{ secrets.OTLP_API_KEY }}
      TF_VAR_otel_exporter_otlp_headers: ${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}
      TF_VAR_cloudflare_tunnel_token: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
      # DIFERENCIA INTENCIONAL con dev, que aqui inyecta
      # TF_VAR_grafana_logs_access_key: environments/prod no declara esa
      # variable -el envio durable de logs por Firehose es de dev- y pasarla
      # haria fallar el ciclo con "Value for undeclared variable".
      TF_IN_AUTOMATION: true
      TF_INPUT: false

    steps:
      - name: Check out authorized IaC revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Contraparte del mismo control en el plan del PR: alli se compara la
      # variable de repositorio y aqui la del Environment, contra el mismo
      # canonico. Va antes de instalar Terraform, igual que en el gemelo de dev.
      # Sin valor canonico para prod el check solo avisa; ver el manifiesto.
      - name: Verify OTLP endpoint parity
        shell: pwsh
        run: ./.github/scripts/assert-telemetry-endpoint.ps1 -Environment prod -Source 'vars.GRAFANA_OTLP_ENDPOINT (environment iac-apply-prod)'

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Validate apply role configuration
        shell: pwsh
        run: |
          if ($env:AWS_ACCOUNT_ID -notmatch '^\d{12}$') {
            throw "Configure AWS_ACCOUNT_ID con los 12 digitos de la cuenta AWS en iac-apply-prod."
          }

      - name: Configure apply AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      # El digest viaja por entorno, no interpolado en la linea de comandos: una entrada
      # de workflow_dispatch es texto libre y no puede llegar al shell sin pasar por una
      # variable. El script lo valida contra el patron del ECR del ambiente.
      - name: Generate and apply a fresh Terraform plan
        shell: pwsh
        env:
          FORCE_BACKEND_IMAGE_URI: ${{ inputs.backend_image_uri }}
        run: ./.github/scripts/terraform-cycle.ps1 -Mode Apply -Environment prod
