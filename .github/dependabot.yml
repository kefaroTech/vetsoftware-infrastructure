# BE-27. Analisis de dependencias del repositorio de infraestructura.
#
# Solo dos ecosistemas, que son los unicos que este repositorio tiene de verdad:
#
#   github-actions -> los 19 workflows usan 4 actions distintas, todas clavadas
#                     por SHA con el tag en un comentario. Un pin por SHA no
#                     caduca, pero tampoco recibe los parches de la action: sin
#                     nadie que lo renueve se congela en la version del dia en
#                     que se escribio. Dependabot entiende el par SHA+comentario
#                     y actualiza los dos.
#   terraform      -> las restricciones de 'required_providers'. Los modulos se
#                     referencian por ruta local (source = "../../modules/x"),
#                     no por registry, asi que aqui Dependabot solo mueve
#                     proveedores; los modulos no son una dependencia externa.
#
# No hay ecosistema docker ni npm: no existe ningun Dockerfile ni package.json
# en el repositorio. La imagen de Trivy la fija por digest
# scripts/security/scan-iac.sh:4, que es un script de shell y Dependabot no lo
# lee; renovarla sigue siendo manual.
#
# target-branch: develop. GitFlow (AGENTS.md) prohibe integrar en main fuera de
# release/* y hotfix/*, y ademas terraform-quality-prod.yml se dispara con los
# PR contra main: un PR de Dependabot contra main arrancaria el gate de
# produccion sin necesidad. develop ya es la rama por defecto del repositorio,
# pero se declara explicitamente para que cambiarla no redirija estos PR en
# silencio.
#
# Las ramas se llaman 'dependabot/<ecosistema>/...' y ese prefijo lo impone
# GitHub: no se puede renombrar. gitflow-guard.yml admite ese prefijo solo
# cuando el autor del PR es dependabot[bot]; si se retira esa excepcion, todos
# estos PR nacen en rojo por el nombre de la rama.

version: 2

updates:
  # ---------------------------------------------------------------------------
  # GitHub Actions
  # ---------------------------------------------------------------------------
  - package-ecosystem: "github-actions"
    # "/" cubre .github/workflows/** completo; no hay composite actions propias
    # (.github/scripts solo contiene PowerShell invocado desde los pasos).
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "America/Bogota"
    # Un unico PR semanal con todo lo que haya subido. Sin agrupar serian hasta
    # 4 PR por semana, cada uno arrancando gitflow-guard y secret-scan.
    groups:
      github-actions:
        patterns:
          - "*"
    open-pull-requests-limit: 2
    commit-message:
      prefix: ":arrow_up: ci"
      include: "scope"
    labels:
      - "dependencies"
      - "github-actions"

  # ---------------------------------------------------------------------------
  # Proveedores de Terraform
  # ---------------------------------------------------------------------------
  - package-ecosystem: "terraform"
    # Se declara cada directorio que tiene su propio bloque required_providers.
    # 'environments/dev' y 'environments/prod' son raices independientes, y
    # 'bootstrap' es una tercera. Los modulos que aparecen aqui son los que
    # ademas se validan como raiz en terraform-quality-dev.yml o traen su propio
    # proveedor (archive en cost_report); los modulos sin versions.tf -cache,
    # ec2_service, ecs_backend, kms, network, scheduled_shutdown, secrets,
    # security, storage_audit- heredan la restriccion de la raiz que los llama y
    # no tienen nada que actualizar.
    directories:
      - "/bootstrap"
      - "/environments/dev"
      - "/environments/prod"
      - "/modules/account_baseline"
      - "/modules/cost_report"
      - "/modules/database"
      - "/modules/ecr"
      - "/modules/github_iac_roles"
      - "/modules/log_shipping"
      - "/modules/monitoring"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:30"
      timezone: "America/Bogota"
    # Un solo PR para los diez directorios. Sin agrupar, una version nueva de
    # hashicorp/aws abriria diez PR que dicen exactamente lo mismo, y cada uno
    # dispararia el gate de dev por el paths: de modules/**.
    groups:
      terraform-providers:
        patterns:
          - "*"
    open-pull-requests-limit: 2
    commit-message:
      prefix: ":arrow_up: chore"
      include: "scope"
    labels:
      - "dependencies"
      - "terraform"
    # AVISO, leer antes de mergear un PR de este ecosistema.
    #
    # Dependabot actualiza la restriccion de versions.tf pero NO regenera
    # .terraform.lock.hcl. El gate ejecuta
    #   terraform init -backend=false -input=false -lockfile=readonly
    # (scripts/quality/terraform-gate.ps1:536), de modo que en cuanto la
    # restriccion nueva deja fuera la version bloqueada, el init falla con
    # "locked provider ... does not match configured version constraint" y el PR
    # se queda en rojo hasta que una persona regenere el lock.
    #
    # Regenerarlo NO es 'terraform init -upgrade' en Windows: eso graba solo el
    # hash de la plataforma local y rompe el gate en el runner de Linux sin que
    # se vea en local. Hay que usar
    #   terraform providers lock -platform=linux_amd64 -platform=windows_amd64 -platform=darwin_arm64
    # en cada directorio afectado. Detalle y estado en los issues #86 y #87 del
    # repositorio.
