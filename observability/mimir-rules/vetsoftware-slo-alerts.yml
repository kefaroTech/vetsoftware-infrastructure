# Alertas sobre SLO: velocidad de consumo del error budget (burn rate) — edición Grafana Cloud.
#
# GEMELO CLOUD de VetSoftware/docker/prometheus-slo-alerts.yml. Consumen exclusivamente las
# series grabadas por vetsoftware-slo-rules.yml (mismo namespace, mismos nombres `vetsoftware:*`),
# así que la traducción de unidades y labels ya ocurrió aguas arriba y estas expresiones son
# idénticas a las locales. Son genéricas: cubren automáticamente cualquier SLO nuevo.
#
# Por qué burn rate y no umbrales fijos (ver VetSoftware/docs/SLO_VETSOFTWARE.md):
# un umbral fijo como "p95 > 1s" no distingue un pico de dos minutos de una degradación de tres
# días. El burn rate mide cuántas veces más rápido de lo sostenible se gasta el presupuesto, así
# que la severidad es proporcional al daño real sobre el compromiso mensual.
#
# Cada nivel exige que la ventana larga y la corta superen el umbral a la vez. La ventana larga
# evita alertar por un pico irrelevante; la corta hace que la alerta se resuelva rápido cuando el
# problema termina, en lugar de quedar colgada horas.
#
# Guarda de volumen: con tráfico bajo, una sola solicitud fallida de tres da una razón de 0.33 y
# un burn rate enorme. Cada nivel exige además un mínimo de eventos en su ventana larga. Los
# mínimos son deliberadamente modestos y deben subirse cuando el tráfico de producción crezca.
# ATENCIÓN dev: con ~370 requests/7d, estas guardas solo se cumplen en ráfagas de actividad —
# ver las advertencias de volumen en el README de este directorio.

namespace: vetsoftware-slo

groups:
  # El nombre lleva el sufijo `-alerts` para no colisionar con el grupo homónimo de reglas de
  # grabación en vetsoftware-slo-rules.yml; el orden de evaluación se declara por nombre.
  - name: vetsoftware-slo-burn-rate-alerts
    interval: 1m
    rules:
      # 14.4x => el presupuesto de 30 días se agotaría en poco más de 2 días.
      # Equivale a gastar el 2 % del presupuesto en una hora.
      - alert: VetSoftwareSloFastBurn
        expr: |
          vetsoftware:slo_burn_rate:ratio_rate1h > 14.4
          and
          vetsoftware:slo_burn_rate:ratio_rate5m > 14.4
          and
          (vetsoftware:sli_total_events:rate1h * 3600) >= 20
        for: 2m
        labels:
          severity: critical
          domain: slo
          service: vetsoftware
        annotations:
          summary: "El SLO {{ $labels.slo }} ({{ $labels.sli }}) agota su presupuesto en ~2 días"
          description: "El burn rate supera 14.4 en las ventanas de 1 hora y 5 minutos. A este ritmo el presupuesto de error de 30 días se consume en poco más de dos días."
          runbook: "docs/ALERTAMIENTO_OPERATIVO.md#vetsoftwareslofastburn"

      # 6x => el presupuesto se agotaría en ~5 días.
      # Equivale a gastar el 5 % del presupuesto en seis horas.
      - alert: VetSoftwareSloSlowBurn
        expr: |
          vetsoftware:slo_burn_rate:ratio_rate6h > 6
          and
          vetsoftware:slo_burn_rate:ratio_rate30m > 6
          and
          (vetsoftware:sli_total_events:rate6h * 21600) >= 60
        for: 15m
        labels:
          severity: warning
          domain: slo
          service: vetsoftware
        annotations:
          summary: "El SLO {{ $labels.slo }} ({{ $labels.sli }}) agota su presupuesto en ~5 días"
          description: "El burn rate supera 6 en las ventanas de 6 horas y 30 minutos. La degradación es sostenida, no un pico."
          runbook: "docs/ALERTAMIENTO_OPERATIVO.md#vetsoftwaresloslowburn"

      # 3x => el presupuesto se agotaría en ~10 días. No requiere atención inmediata;
      # se atiende como trabajo planificado dentro del ciclo.
      - alert: VetSoftwareSloTicketBurn
        expr: |
          vetsoftware:slo_burn_rate:ratio_rate1d > 3
          and
          vetsoftware:slo_burn_rate:ratio_rate2h > 3
          and
          (vetsoftware:sli_total_events:rate1d * 86400) >= 200
        for: 1h
        labels:
          severity: warning
          domain: slo
          service: vetsoftware
        annotations:
          summary: "El SLO {{ $labels.slo }} ({{ $labels.sli }}) agota su presupuesto en ~10 días"
          description: "El burn rate supera 3 en las ventanas de 1 día y 2 horas. Corresponde trabajo planificado, no respuesta inmediata."
          runbook: "docs/ALERTAMIENTO_OPERATIVO.md#vetsoftwaresloticketburn"

  - name: vetsoftware-slo-error-budget
    interval: 1m
    rules:
      - alert: VetSoftwareSloErrorBudgetLow
        expr: |
          vetsoftware:slo_error_budget_remaining:ratio30d < 0.25
          and
          vetsoftware:slo_error_budget_remaining:ratio30d >= 0
        for: 30m
        labels:
          severity: warning
          domain: slo
          service: vetsoftware
        annotations:
          summary: "Al SLO {{ $labels.slo }} ({{ $labels.sli }}) le queda menos del 25 % de presupuesto"
          description: "Según la política de gobierno, los cambios no críticos de este dominio requieren revisión explícita hasta que el presupuesto se recupere."
          runbook: "docs/ALERTAMIENTO_OPERATIVO.md#vetsoftwaresloerrorbudgetlow"

      - alert: VetSoftwareSloErrorBudgetExhausted
        expr: vetsoftware:slo_error_budget_remaining:ratio30d < 0
        for: 30m
        labels:
          severity: critical
          domain: slo
          service: vetsoftware
        annotations:
          summary: "El SLO {{ $labels.slo }} ({{ $labels.sli }}) está incumplido en la ventana de 30 días"
          description: "El presupuesto de error se agotó. Solo deberían desplegarse correcciones de fiabilidad de este dominio hasta que la ventana rodante lo recupere."
          runbook: "docs/ALERTAMIENTO_OPERATIVO.md#vetsoftwaresloerrorbudgetexhausted"

  - name: vetsoftware-slo-integrity
    interval: 1m
    rules:
      # Un SLO declarado que no produce serie de eventos no se está midiendo. Ocurre cuando el
      # umbral de latencia no coincide con ningún borde `le` publicado (en cloud, además, si el
      # borde se escribe con decimal: `le="1000.0"` no casa), cuando cambia una ruta incluida en
      # el selector de `uri`, o cuando se renombra una métrica de negocio.
      # `slo_objective:ratio` siempre existe (proviene de `vector()`), así que la resta de
      # conjuntos revela exactamente qué SLI dejó de medirse.
      # ATENCIÓN dev: con el volumen actual, esta alerta dispara de forma legítima para la
      # mayoría de SLIs la mayoría de los días — ver README de este directorio.
      - alert: VetSoftwareSloSeriesAbsent
        expr: |
          vetsoftware:slo_objective:ratio
          unless
          vetsoftware:sli_total_events:rate1d
        for: 1h
        labels:
          severity: warning
          domain: slo
          service: vetsoftware
        annotations:
          summary: "El SLO {{ $labels.slo }} ({{ $labels.sli }}) no está produciendo datos"
          description: "El objetivo está declarado pero no existe serie de eventos en las últimas 24 horas. Revisar el selector de la regla de grabación antes que el objetivo. En un entorno local o de desarrollo, una operación que nunca se ejecutó dispara esta alerta de forma legítima."
          runbook: "docs/ALERTAMIENTO_OPERATIVO.md#vetsoftwaresloseriesabsent"
