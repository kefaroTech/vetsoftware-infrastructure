# Alertas de plataforma — subconjunto PORTABLE a Grafana Cloud (Mimir).
#
# GEMELO CLOUD parcial de VetSoftware/docker/prometheus-platform-alerts.yml: solo las alertas
# cuyas métricas existen en el mundo OTLP-push. Lo que NO se portó (up/otelcol_*/loki_*/tempo_*/
# redis_*/alertmanager_*/prometheus_*) y su motivo, en el README de este directorio; la salud
# del transporte de logs la vigilan las alarmas CloudWatch de modules/log_shipping/alarms.tf.
# Traducción aplicada: timers en milisegundos, job="mainvet/vetsoftware", jvm_threads_live,
# y el fix de group_left() en la alerta de tokens (el threshold no tiene token_type).

namespace: vetsoftware-platform

groups:
  - name: vetsoftware-http
    interval: 1m
    rules:
      - alert: VetSoftwareHttp5xxRateHigh
        expr: |
          (
            sum(rate(http_server_requests_milliseconds_count{job="mainvet/vetsoftware",status=~"5.."}[5m]))
            /
            clamp_min(sum(rate(http_server_requests_milliseconds_count{job="mainvet/vetsoftware"}[5m])), 0.001)
          ) > 0.05
          and
          sum(increase(http_server_requests_milliseconds_count{job="mainvet/vetsoftware"}[5m])) >= 20
        for: 5m
        labels:
          severity: critical
          domain: backend
          service: vetsoftware
        annotations:
          summary: "La tasa HTTP 5xx supera el 5 %"
          description: "El backend superó el 5 % de respuestas 5xx con al menos 20 solicitudes en cinco minutos."
          runbook: "docs/ALERTAMIENTO_OPERATIVO.md#vetsoftwarehttp5xxratehigh"

      - alert: VetSoftwareHttpP95LatencyHigh
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (
              rate(http_server_requests_milliseconds_bucket{job="mainvet/vetsoftware"}[5m])
            )
          ) > 1000
          and
          sum(increase(http_server_requests_milliseconds_count{job="mainvet/vetsoftware"}[5m])) >= 20
        for: 10m
        labels:
          severity: warning
          domain: backend
          service: vetsoftware
        annotations:
          summary: "La latencia HTTP p95 supera un segundo"
          description: "La latencia p95 agregada permaneció por encima de un segundo (1000 ms) con volumen suficiente."
          runbook: "docs/ALERTAMIENTO_OPERATIVO.md#vetsoftwarehttpp95latencyhigh"

      - alert: VetSoftwareHttpP99LatencyCritical
        expr: |
          histogram_quantile(
            0.99,
            sum by (le) (
              rate(http_server_requests_milliseconds_bucket{job="mainvet/vetsoftware"}[5m])
            )
          ) > 2000
          and
          sum(increase(http_server_requests_milliseconds_count{job="mainvet/vetsoftware"}[5m])) >= 20
        for: 10m
        labels:
          severity: critical
          domain: backend
          service: vetsoftware
        annotations:
          summary: "La latencia HTTP p99 supera dos segundos"
          description: "La latencia p99 agregada permaneció por encima de dos segundos (2000 ms) con volumen suficiente."
          runbook: "docs/ALERTAMIENTO_OPERATIVO.md#vetsoftwarehttpp99latencycritical"

  - name: vetsoftware-runtime
    interval: 1m
    rules:
      - alert: VetSoftwareJvmHeapHigh
        expr: |
          (
            sum(jvm_memory_used_bytes{job="mainvet/vetsoftware",area="heap"})
            /
            clamp_min(sum(jvm_memory_max_bytes{job="mainvet/vetsoftware",area="heap"}), 1)
          ) > 0.85
        for: 10m
        labels:
          severity: warning
          domain: runtime
          service: vetsoftware
        annotations:
          summary: "El uso de heap de la JVM supera el 85 %"
          description: "El heap se mantuvo por encima del 85 % durante diez minutos."
          runbook: "docs/ALERTAMIENTO_OPERATIVO.md#vetsoftwarejvmheaphigh"

      - alert: VetSoftwareProcessCpuHigh
        expr: process_cpu_usage{job="mainvet/vetsoftware"} > 0.85
        for: 10m
        labels:
          severity: warning
          domain: runtime
          service: vetsoftware
        annotations:
          summary: "El proceso Java supera el 85 % de CPU"
          description: "El uso de CPU del proceso se mantuvo por encima del 85 % durante diez minutos."
          runbook: "docs/ALERTAMIENTO_OPERATIVO.md#vetsoftwareprocesscpuhigh"

      - alert: VetSoftwareJvmGcOverheadHigh
        expr: jvm_gc_overhead{job="mainvet/vetsoftware"} > 0.20
        for: 10m
        labels:
          severity: warning
          domain: runtime
          service: vetsoftware
        annotations:
          summary: "La JVM dedica demasiado tiempo al recolector de basura"
          description: "El overhead de GC superó el 20 % durante diez minutos."
          runbook: "docs/ALERTAMIENTO_OPERATIVO.md#vetsoftwarejvmgcoverheadhigh"

      # Renombre cloud: la serie llega como jvm_threads_live (sin el sufijo _threads del scrape).
      - alert: VetSoftwareJvmThreadCountHigh
        expr: jvm_threads_live{job="mainvet/vetsoftware"} > 200
        for: 10m
        labels:
          severity: warning
          domain: runtime
          service: vetsoftware
        annotations:
          summary: "La JVM mantiene más de 200 hilos vivos"
          description: "El número de hilos vivos se mantuvo por encima del umbral durante diez minutos."
          runbook: "docs/ALERTAMIENTO_OPERATIVO.md#vetsoftwarejvmthreadcounthigh"

  - name: vetsoftware-dependencies
    interval: 1m
    rules:
      - alert: VetSoftwareDatabasePoolSaturated
        expr: |
          (
            hikaricp_connections_active{job="mainvet/vetsoftware"}
            /
            clamp_min(hikaricp_connections_max{job="mainvet/vetsoftware"}, 1)
          ) > 0.85
        for: 5m
        labels:
          severity: critical
          domain: database
          service: vetsoftware
        annotations:
          summary: "El pool de conexiones está saturado"
          description: "Más del 85 % de las conexiones HikariCP permanecen activas desde hace cinco minutos."
          runbook: "docs/ALERTAMIENTO_OPERATIVO.md#vetsoftwaredatabasepoolsaturated"

      - alert: VetSoftwareDatabaseConnectionPending
        expr: hikaricp_connections_pending{job="mainvet/vetsoftware"} > 0
        for: 3m
        labels:
          severity: warning
          domain: database
          service: vetsoftware
        annotations:
          summary: "Hay solicitudes esperando conexión a la base de datos"
          description: "HikariCP mantiene solicitudes pendientes desde hace al menos tres minutos."
          runbook: "docs/ALERTAMIENTO_OPERATIVO.md#vetsoftwaredatabaseconnectionpending"

      - alert: VetSoftwareDatabaseConnectionTimeouts
        expr: increase(hikaricp_connections_timeout_total{job="mainvet/vetsoftware"}[5m]) > 0
        for: 1m
        labels:
          severity: critical
          domain: database
          service: vetsoftware
        annotations:
          summary: "Se agotó el tiempo esperando una conexión"
          description: "HikariCP registró al menos un timeout de conexión durante los últimos cinco minutos."
          runbook: "docs/ALERTAMIENTO_OPERATIVO.md#vetsoftwaredatabaseconnectiontimeouts"

  - name: vetsoftware-security-token-retention
    interval: 1m
    rules:
      # Portada CORREGIDA respecto al local: `vetsoftware_security_tokens_rows` tiene la etiqueta
      # `token_type` y el threshold NO la tiene; sin group_left() el match many-to-one falla en
      # runtime y la alerta muere en silencio.
      - alert: VetSoftwareSecurityTokenTableGrowth
        expr: |
          vetsoftware_security_tokens_rows{job="mainvet/vetsoftware"}
          > on(job, instance) group_left()
          vetsoftware_security_tokens_growth_threshold{job="mainvet/vetsoftware"}
        for: 30m
        labels:
          severity: warning
          domain: database
          service: vetsoftware
        annotations:
          summary: "Una tabla de tokens de seguridad supera el umbral de crecimiento"
          description: "La tabla indicada por token_type sigue por encima del umbral después de varias ejecuciones de la purga."
          runbook: "docs/ALERTAMIENTO_OPERATIVO.md#vetsoftwaresecuritytokentablegrowth"
