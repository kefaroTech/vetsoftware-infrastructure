# Heartbeat de ingesta — SOLO PRODUCCIÓN. NO sincronizar a dev.
#
# Sustituto de VetSoftwareBackendDown para el mundo OTLP-push: no hay scrape, así que `up` no
# existe y la señal de caída es la AUSENCIA de ingesta sostenida. Se exige la ausencia de DOS
# series independientes y siempre presentes mientras el proceso vive (target_info viene del
# recurso OTel en cada export; jvm_threads_live la publica el runtime sin depender de tráfico):
# así un simple renombre de una métrica no dispara un falso "backend caído".
#
# Por qué NO va a dev: EventBridge apaga el ambiente a las 20:00/20:15 Bogotá de lunes a viernes
# y los fines de semana completos — esta alerta sonaría cada noche y sería ruido puro. El
# equivalente dev de "el backend no está" son los eventos de ECS del lado AWS, no el ruler.

namespace: vetsoftware-heartbeat

groups:
  - name: vetsoftware-heartbeat
    interval: 1m
    rules:
      - alert: VetSoftwareBackendTelemetryAbsent
        expr: |
          absent_over_time(target_info{job="mainvet/vetsoftware"}[15m])
          and on()
          absent_over_time(jvm_threads_live{job="mainvet/vetsoftware"}[15m])
        for: 5m
        labels:
          severity: critical
          domain: availability
          service: vetsoftware
        annotations:
          summary: "El backend de VetSoftware lleva 15 minutos sin enviar telemetría"
          description: "Ni target_info ni jvm_threads_live han recibido muestras en 15 minutos: o el proceso está caído, o el export OTLP está roto de extremo a extremo. Comprobar primero el servicio ECS y después el pipeline de export (credenciales OTLP, red de salida, estado de Grafana Cloud)."
          runbook: "docs/ALERTAMIENTO_OPERATIVO.md#vetsoftwarebackenddown"
