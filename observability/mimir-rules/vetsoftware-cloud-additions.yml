# Alertas NUEVAS, solo cloud — cubren los dos incidentes vivos que motivaron este trabajo
# (hallazgos TEL-10 y TEL-12 de la auditoría de observabilidad).
#
# No existen en el stack local porque nacen de series que solo se validaron en cloud
# (`tasks_scheduled_execution_milliseconds_count` con `job_outcome`,
#  `email_send_template_milliseconds_count` con `email_outcome`). Consumen series ya
# existentes: 0 series nuevas de ingesta; solo las series ALERTS/ALERTS_FOR_STATE del ruler.
#
# Patrón deliberado: cada familia tiene una variante warning (fallo parcial: hay reintento o
# hay éxitos conviviendo con fallos) y una critical (fallo TOTAL: cero éxitos — determinista
# y sistémico, nadie lo recupera sin intervención). El `unless` hace la variante critical
# robusta ante la ausencia de la serie de éxitos: si nunca hubo un éxito en la ventana, la
# comparación `== 0` clásica no casaría con nada y la alerta moriría en silencio.

namespace: vetsoftware-additions

groups:
  - name: vetsoftware-scheduled-jobs
    interval: 1m
    rules:
      # Contexto real (TEL-10): dian.pending.reconciliation acumula ~52 fallos en 7 días por el
      # documento 44 atascado. Un job programado que falla no tiene usuario delante que reintente:
      # sin esta alerta el fallo solo existe en un contador que nadie mira.
      - alert: VetSoftwareScheduledJobFailing
        expr: |
          sum by (job_name) (
            increase(tasks_scheduled_execution_milliseconds_count{job="mainvet/vetsoftware",job_outcome=~"failure|error"}[30m])
          ) > 0
        for: 30m
        labels:
          severity: warning
          domain: backend
          service: vetsoftware
        annotations:
          summary: "El job programado {{ $labels.job_name }} está registrando fallos"
          description: "El job {{ $labels.job_name }} lleva al menos 30 minutos acumulando ejecuciones con job_outcome failure/error. Revisar sus logs por trace_id antes de que el trabajo pendiente se acumule."
          runbook: "docs/ALERTAMIENTO_OPERATIVO.md#vetsoftwarescheduledjobfailing"

      # Variante critical: TODAS las ejecuciones de las últimas 2 horas fallaron (ni un éxito).
      # Es fallo determinista y sistémico, no un tropiezo transitorio que el siguiente ciclo
      # corrige. El `for: 30m` confirma estabilidad de la condición antes de escalar.
      - alert: VetSoftwareScheduledJobFailing
        expr: |
          sum by (job_name) (
            increase(tasks_scheduled_execution_milliseconds_count{job="mainvet/vetsoftware",job_outcome=~"failure|error"}[2h])
          ) > 0
          unless
          sum by (job_name) (
            increase(tasks_scheduled_execution_milliseconds_count{job="mainvet/vetsoftware",job_outcome="success"}[2h])
          ) > 0
        for: 30m
        labels:
          severity: critical
          domain: backend
          service: vetsoftware
        annotations:
          summary: "El job programado {{ $labels.job_name }} falla el 100 % de sus ejecuciones"
          description: "Todas las ejecuciones de {{ $labels.job_name }} en las últimas 2 horas terminaron en failure/error, sin ningún éxito. El fallo es sistémico: ningún ciclo posterior lo va a recuperar solo."
          runbook: "docs/ALERTAMIENTO_OPERATIVO.md#vetsoftwarescheduledjobfailing"

  - name: vetsoftware-email-delivery
    interval: 1m
    rules:
      # Fallo parcial: hay éxitos y fallos conviviendo. Umbral por tasa con guarda de volumen
      # (estilo de la casa), calibrado bajo porque el correo es de baja frecuencia.
      - alert: VetSoftwareEmailSendFailing
        expr: |
          (
            sum(increase(email_send_template_milliseconds_count{job="mainvet/vetsoftware",email_outcome="failure"}[30m]))
            /
            clamp_min(sum(increase(email_send_template_milliseconds_count{job="mainvet/vetsoftware"}[30m])), 1)
          ) > 0.10
          and
          sum(increase(email_send_template_milliseconds_count{job="mainvet/vetsoftware"}[30m])) >= 5
        for: 15m
        labels:
          severity: warning
          domain: backend
          service: vetsoftware
        annotations:
          summary: "Más del 10 % de los envíos de correo están fallando"
          description: "La tasa de email_outcome=failure supera el 10 % en la última media hora con al menos 5 envíos. El envío es fire-and-forget: cada fallo es un correo perdido para el destinatario, aunque la petición HTTP del usuario haya respondido 200."
          runbook: "docs/ALERTAMIENTO_OPERATIVO.md#vetsoftwareemailsendfailing"

      # Fallo TOTAL (TEL-12, el caso vivo): hay fallos y cero éxitos sostenido 30 minutos.
      # El incidente actual es determinista — Resend responde 403 porque el dominio remitente
      # no está verificado — y fallará el 100 % de los envíos hasta que alguien lo corrija:
      # el arreglo es verificar el dominio kefaro.tech en Resend (o cambiar el remitente a un
      # dominio ya verificado). Ningún reintento lo recupera.
      - alert: VetSoftwareEmailSendFailing
        expr: |
          sum(increase(email_send_template_milliseconds_count{job="mainvet/vetsoftware",email_outcome="failure"}[30m])) > 0
          unless
          sum(increase(email_send_template_milliseconds_count{job="mainvet/vetsoftware",email_outcome="success"}[30m])) > 0
        for: 10m
        labels:
          severity: critical
          domain: backend
          service: vetsoftware
        annotations:
          summary: "El envío de correo falla al 100 %: ningún éxito en 30 minutos"
          description: "Hay envíos con email_outcome=failure y ninguno con success en la última media hora: fallo total y determinista, no transitorio. Caso conocido: 403 de Resend por dominio remitente no verificado — el arreglo es verificar kefaro.tech en Resend, no reintentar."
          runbook: "docs/ALERTAMIENTO_OPERATIVO.md#vetsoftwareemailsendfailing"

  # ---------------------------------------------------------------------------------------
  # Salud del proceso. Sustituye por otra vía lo que el stack local cubría con `up`, que en
  # ingesta push OTLP no existe: aquí la señal no es "el scrape falla" sino "el proceso se
  # reinicia una y otra vez". Un backend en crash loop se ve desde fuera como lentitud, no
  # como caída — el heartbeat de prod no lo caza porque entre reinicio y reinicio sí emite.
  # ---------------------------------------------------------------------------------------
  - name: vetsoftware-process-health
    interval: 1m
    rules:
      # `process_start_time_milliseconds` es el instante de arranque: cambia SOLO al reiniciar,
      # así que contar sus cambios cuenta reinicios. El umbral de 3 en 1 hora es lo que separa
      # el crash loop del arranque legítimo: en dev, EventBridge apaga a las 20:00 y arranca por
      # la mañana (1 cambio al día, jamás 3 en una hora), así que la regla es segura en los dos
      # ambientes sin excepciones horarias.
      - alert: VetSoftwareBackendRestartLoop
        expr: |
          changes(process_start_time_milliseconds{job="mainvet/vetsoftware"}[1h]) >= 3
        for: 5m
        labels:
          severity: critical
          domain: backend
          service: vetsoftware
        annotations:
          summary: "El backend se ha reiniciado {{ $value | humanize }} veces en la última hora"
          description: "Reinicios repetidos apuntan a OOM kill, fallo de arranque o un health check matando la task. Revisar los eventos de la task de ECS y la memoria del contenedor antes que el código: un crash loop consume la ventana de despliegue y deja peticiones sin atender entre reinicio y reinicio."
          runbook: "docs/ALERTAMIENTO_OPERATIVO.md#vetsoftwarebackendrestartloop"

  # ---------------------------------------------------------------------------------------
  # Seguridad. Cierra el hallazgo TEL-36: las sondas anti-enumeración y los fallos de login
  # solo existían como log INFO/WARN, sin ninguna tasa sobre la que alertar. Un ataque de
  # fuerza bruta o de enumeración de códigos de empleado era invisible por diseño.
  #
  # Verificado en dev: los 401/403 aparecen ÚNICAMENTE en /auth/login/employee y
  # /auth/login/system, así que el selector por uri es preciso y no arrastra el ruido de los
  # tokens de acceso caducados del ciclo de refresco normal del front.
  # ---------------------------------------------------------------------------------------
  - name: vetsoftware-auth-abuse
    interval: 1m
    rules:
      - alert: VetSoftwareAuthFailureSpike
        expr: |
          sum(rate(http_server_requests_milliseconds_count{job="mainvet/vetsoftware",uri=~"(/api/v1)?/auth/login/(employee|system)",status=~"401|403"}[5m])) > 0.5
        for: 10m
        labels:
          severity: warning
          domain: security
          service: vetsoftware
        annotations:
          summary: "Tasa alta de credenciales rechazadas en el login"
          description: "Más de 0,5 rechazos por segundo (~30/min) sostenidos 10 minutos en /auth/login/*. Puede ser fuerza bruta, enumeración de códigos de empleado o un cliente mal configurado en bucle. Contrastar client.ip y user_agent.original en el canal AUDIT de Loki (event=login_failure) antes de bloquear nada."
          runbook: "docs/ALERTAMIENTO_OPERATIVO.md#vetsoftwareauthfailurespike"

  # ---------------------------------------------------------------------------------------
  # Valkey/Redis vía el cliente Lettuce.
  #
  # Las tres alertas de Redis del stack local NO se portaron porque dependían del
  # `redis_exporter` del compose, que en cloud no existe. Esa conclusión era correcta pero
  # incompleta: el cliente **Lettuce sí está instrumentado** y sus series llegan por OTLP
  # (`lettuce_milliseconds_*`, con etiqueta `error`). Recupera cobertura que dimos por perdida.
  #
  # Importa más de lo que parece: Valkey no solo cachea permisos y catálogos — sostiene el
  # rate limiting de bucket4j. Si se degrada, el control de fuerza bruta falla (abierto o
  # cerrado) sin que ninguna otra señal lo diga.
  # ---------------------------------------------------------------------------------------
  - name: vetsoftware-valkey
    interval: 1m
    rules:
      # `error="none"` es el valor en operación normal; cualquier otro valor es el nombre de la
      # excepción del comando. No se agrupa por `error` en la condición para que una tormenta de
      # excepciones distintas no fragmente la alerta en varias.
      - alert: VetSoftwareValkeyCommandsFailing
        expr: |
          sum(rate(lettuce_milliseconds_count{job="mainvet/vetsoftware",error!="none"}[5m])) > 0
        for: 5m
        labels:
          severity: critical
          domain: cache
          service: vetsoftware
        annotations:
          summary: "Los comandos a Valkey están fallando"
          description: "El cliente Lettuce registra comandos con error sostenidos 5 minutos. Valkey sostiene la caché de permisos y el rate limiting de bucket4j: con él degradado, el control de fuerza bruta deja de ser fiable. Revisar el estado de ElastiCache y la conectividad antes que el código."
          runbook: "docs/ALERTAMIENTO_OPERATIVO.md#vetsoftwarevalkeycommandsfailing"

      # Latencia p99 de comando. Valkey es una dependencia de camino caliente: si tarda, la
      # petición HTTP tarda. 50 ms de p99 es holgado para una caché en la misma región —
      # rebasarlo de forma sostenida indica saturación, red o eviction agresivo.
      - alert: VetSoftwareValkeyLatencyHigh
        expr: |
          histogram_quantile(
            0.99,
            sum by (le) (rate(lettuce_milliseconds_bucket{job="mainvet/vetsoftware"}[5m]))
          ) > 50
        for: 10m
        labels:
          severity: warning
          domain: cache
          service: vetsoftware
        annotations:
          summary: "La latencia p99 de Valkey supera 50 ms"
          description: "El p99 de los comandos Lettuce lleva 10 minutos por encima de 50 ms. Valkey está en el camino caliente de la autorización: su latencia se suma a la de cada petición. Revisar CPU/memoria de ElastiCache y la tasa de eviction."
          runbook: "docs/ALERTAMIENTO_OPERATIVO.md#vetsoftwarevalkeylatencyhigh"
